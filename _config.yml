#
# This file contains configuration flags to customize your site
#

# Name of your site (displayed in the header)
name: "weiyinerzui's blog"
# Short bio or description (used for SEO / feed)
description: "个人技术公众号：走在学习的小路上"

# 首页大标题与副标题
tagline: "走在学习的小路上"
blurb: "记录技术折腾、审计备考与英语学习的笔记。慢一点，但一直在路上。"

#
# Flags below are optional
#

# URL of your avatar or profile pic (you could use your GitHub profile pic)
# 首页头像（站点根目录相对路径）
avatar: /images/avatar.png
# Tabs in header. There are 'Blog', 'About', 'Archive', 'Tags'
# and URL Link(e.g. 'Theme' tab below) tabs. If you don't need one, just delete
# it from the list(Delete '- name: ' and 'url: ', too!)
navigation:
  - name: 首页
    url: /
  - name: 关于
    url: /about/
  - name: 归档
    url: /archive/
  - name: 标签
    url: /tags/


# Pagination
paginate: 6

excerpt_separator: <!-- more -->

# Includes an icon in the footer for each username you enter
footer-links:
  #weibo: frommidworld #请输入你的微博个性域名 https://www.weibo.com/<thispart>
  behance: # https://www.behance.net/<username>
  dribbble:
  zhihu: 
  email: weiyinerzui@126.com
  facebook:
  flickr:
  github: weiyinerzui 
  googleplus: # anything in your profile username that comes after plus.google.com/
  instagram:
  linkedin:
  pinterest:
  rss: # just type anything here for a working RSS icon
  stackoverflow: # your stackoverflow profile, e.g. "users/50476/bart-kiers"
  tumblr: # https://<username>.tumblr.com
  #twitter: frommidworld
  youtube:

# Text under the icons in footer
footer-text: Copyright (c) weiyinerzui

# Enter your Disqus shortname (not your username) to enable commenting on posts
# You can find your shortname on the Settings page of your Disqus account
disqus: # fromendworld

