{% if site.gitalk and site.gitalk.clientID %}
<div class="comments">
  <h2 class="comments-title">评论</h2>
  <div id="gitalk-container"></div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.css">
  <script src="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js"></script>
  <script>
    (function () {
      if (typeof Gitalk === 'undefined') {
        var box = document.getElementById('gitalk-container');
        if (box) box.innerHTML = '<p class="comments-fallback">评论组件加载失败，可到 <a href="https://github.com/{{ site.gitalk.owner }}/{{ site.gitalk.repo }}/issues">GitHub Issues</a> 留言。</p>';
        return;
      }
      // 用路径的短哈希作为 id，避免中文长标题超过 Gitalk 的 50 字符限制
      function hash(str) {
        var h = 5381, i = str.length;
        while (i) { h = (h * 33) ^ str.charCodeAt(--i); }
        return (h >>> 0).toString(36);
      }
      var gitalk = new Gitalk({
        clientID: "{{ site.gitalk.clientID }}",
        clientSecret: "{{ site.gitalk.clientSecret }}",
        repo: "{{ site.gitalk.repo }}",
        owner: "{{ site.gitalk.owner }}",
        admin: ["{{ site.gitalk.owner }}"],
        id: window.location.pathname.slice(0, 48) + hash(window.location.pathname),
        labels: ["comment"],
        distractionFreeMode: false,
        language: "zh-CN"
      });
      gitalk.render('gitalk-container');
    })();
  </script>
</div>
{% endif %}
