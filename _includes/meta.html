<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta name="author" content="{{ site.name }}">

    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    {% if page.title %}<meta property="og:title" content="{{ page.title }}">{% endif %}
    {% if page.url %}<meta property="og:url" content="{{ site.url }}{{ page.url }}">{% endif %}

    <meta name="twitter:card" content="summary">
    {% if page.title %}<meta name="twitter:title" content="{{ page.title }}">{% endif %}
